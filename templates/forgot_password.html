<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password recovery | SentinelDF</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e5edf8;font:15px/1.5 Segoe UI,Arial,sans-serif;padding:24px}.card{width:min(100%,440px);padding:32px;border:1px solid #263750;border-radius:18px;background:#111c2e;box-shadow:0 18px 55px #0005}.brand{color:#65d7c2;font-weight:700;letter-spacing:.12em;font-size:13px}h1{font-size:26px;margin:10px 0 4px}.subtitle{color:#9fb0c8}label{display:block;margin:17px 0 7px;color:#cbd7e8}input{width:100%;padding:12px 13px;border:1px solid #344760;border-radius:9px;background:#0b1423;color:#fff;font:inherit}input:focus{outline:2px solid #37bfa7;border-color:transparent}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:#25b99f;color:#06231e;font-weight:700;font-size:15px;cursor:pointer}a{color:#65d7c2;text-decoration:none}.message{padding:10px 12px;border-radius:8px;margin:16px 0 0;background:#4b2630;color:#ffdce2}.success{background:#173b35;color:#b9f8e8}.hint{font-size:12px;color:#8fa2bb;margin-top:15px}.links{margin-top:18px;font-size:14px}</style></head>
<body><main class="card"><div class="brand">SENTINELDF</div><h1>Reset password</h1><div class="subtitle">Enter your username and configured recovery code.</div>
{% if error %}<div class="message" role="alert">{{ error }}</div>{% endif %}{% if success %}<div class="message success" role="status">{{ success }}</div>{% endif %}
<form method="post" action="{{ url_for('forgot_password') }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="recovery_code">Recovery code</label><input id="recovery_code" name="recovery_code" type="password" autocomplete="off" required><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Reset password</button></form>
<div class="hint">Password recovery requires SENTINELDF_RECOVERY_CODE to be configured in the environment.</div><div class="links"><a href="{{ url_for('login') }}">Back to sign in</a></div></main></body></html>
